name: Eventu
options:
  bundleIdPrefix: com.eventu
targets:
  Eventu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [EventuApp]
    settings:
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 1
    info:
      path: EventuApp/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Necesitamos acceso a la cámara para escanear las entradas."
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: CoreImage.framework
      - package: Supabase
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: 2.0.0
