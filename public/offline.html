<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - Eventu</title>
  <meta name="theme-color" content="#E53935">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #ffffff;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    
    .icon svg {
      width: 100%;
      height: 100%;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #ffffff;
    }
    
    p {
      font-size: 16px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .tickets-hint {
      background: rgba(229, 57, 53, 0.15);
      border: 1px solid rgba(229, 57, 53, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }
    
    .tickets-hint h3 {
      font-size: 14px;
      color: #E53935;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .tickets-hint p {
      font-size: 14px;
      margin: 0;
      color: rgba(255,255,255,0.8);
    }
    
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #E53935;
      color: white;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
    }
    
    .btn:hover {
      background: #B71C1C;
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      margin-left: 12px;
    }
    
    .btn-secondary:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.5);
    }
    
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .status {
      margin-top: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      background: #FFC107;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    
    .wave {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      pointer-events: none;
    }
    
    .wave svg {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 100%;
    }
    
    .wave path {
      fill: rgba(229, 57, 53, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Offline Icon -->
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="#E53935" opacity="0.3"/>
        <path d="M23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7L12 21.5 23.64 7z" fill="none" stroke="#E53935" stroke-width="2"/>
        <line x1="1" y1="1" x2="23" y2="23" stroke="#E53935" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    
    <h1>Sin conexión</h1>
    <p>
      Parece que no tienes conexión a internet. 
      No te preocupes, tus boletas guardadas siguen disponibles.
    </p>
    
    <!-- Tickets Hint -->
    <div class="tickets-hint">
      <h3>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22 10V6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v4c1.1 0 2 .9 2 2s-.9 2-2 2v4c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2v-4c-1.1 0-2-.9-2-2s.9-2 2-2zm-9 7.5h-2v-2h2v2zm0-4.5h-2v-2h2v2zm0-4.5h-2v-2h2v2z"/>
        </svg>
        Boletas sin conexión
      </h3>
      <p>
        Tus boletas con códigos QR pre-generados están disponibles 
        aunque no tengas internet.
      </p>
    </div>
    
    <div class="actions">
      <a href="/dashboard/tickets" class="btn">Ver mis boletas</a>
      <button onclick="location.reload()" class="btn btn-secondary">Reintentar</button>
    </div>
    
    <div class="status">
      <span class="status-dot"></span>
      Esperando conexión...
    </div>
  </div>
  
  <!-- Decorative Wave -->
  <div class="wave">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path d="M0,288L48,272C96,256,192,224,288,197.3C384,171,480,149,576,165.3C672,181,768,235,864,250.7C960,267,1056,245,1152,224C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>
  
  <script>
    // Check for online status and redirect
    window.addEventListener('online', () => {
      location.reload();
    });
  </script>
</body>
</html>
